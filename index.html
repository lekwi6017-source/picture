<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GitHub 图床工作台</title>
<style>
  :root{
    --bg:#f6f8fa;
    --panel:#ffffff;
    --border:#e4e8ee;
    --text:#1f2328;
    --muted:#6b7280;
    --primary:#2563eb;
    --primary-dark:#1d4ed8;
    --danger:#dc2626;
    --ok:#16a34a;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; height:100%; }
  body{
    background:var(--bg); color:var(--text); font-size:14px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  button,input{ font-family:inherit; }

  /* ---------- 顶栏 ---------- */
  .app{ display:flex; flex-direction:column; height:100vh; }
  .topbar{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:10px 18px; background:#fff; border-bottom:1px solid var(--border);
    flex:none;
  }
  .brand{ display:flex; align-items:center; gap:10px; min-width:0; }
  .brand .logo{
    width:34px; height:34px; border-radius:9px; background:#eff6ff; color:var(--primary);
    display:flex; align-items:center; justify-content:center; font-size:18px; flex:none;
  }
  .brand h1{ font-size:15px; margin:0; font-weight:600; }
  .brand .sub{ margin:2px 0 0; font-size:12px; color:var(--muted); }
  .topbar-right{ display:flex; align-items:center; gap:8px; flex:none; }

  /* ---------- 标签页（窄屏） ---------- */
  .tabs{ display:none; gap:6px; padding:8px 12px; background:#fff; border-bottom:1px solid var(--border); flex:none; }
  .tab{
    flex:1; padding:8px 6px; font-size:13px; border-radius:8px; cursor:pointer;
    border:1px solid var(--border); background:#fff; color:var(--muted);
  }
  .tab.active{ background:#eff6ff; border-color:#bfdbfe; color:var(--primary); font-weight:600; }

  /* ---------- 三栏布局 ---------- */
  .layout{
    flex:1; display:grid; grid-template-columns:320px minmax(0,1fr) 300px;
    gap:14px; padding:14px; overflow:hidden; min-height:0;
  }
  .panel{
    background:var(--panel); border:1px solid var(--border); border-radius:12px;
    overflow:auto; padding:14px; min-height:0;
  }
  .panel-center{ padding:0; display:flex; flex-direction:column; overflow:hidden; }

  /* ---------- 通用控件 ---------- */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    border:1px solid var(--border); background:#fff; color:var(--text);
    padding:8px 12px; border-radius:8px; font-size:13px; cursor:pointer;
    transition:.15s; white-space:nowrap; text-decoration:none;
  }
  .btn:hover{ background:#f3f4f6; }
  .btn:disabled{ opacity:.6; cursor:not-allowed; }
  .btn-primary{ background:var(--primary); border-color:var(--primary); color:#fff; }
  .btn-primary:hover{ background:var(--primary-dark); }
  .btn-danger{ background:#fff; border-color:#fca5a5; color:var(--danger); }
  .btn-danger:hover{ background:#fef2f2; }
  .btn-ghost{ background:#fff; }
  .btn-sm{ padding:5px 10px; font-size:12px; }
  .btn-icon{ padding:6px 9px; }
  .btn-icon.active{ background:#eff6ff; border-color:#bfdbfe; color:var(--primary); }

  .input{
    width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:8px;
    font-size:13px; color:var(--text); background:#fff; outline:none; transition:.15s;
  }
  .input:focus{ border-color:var(--primary); box-shadow:0 0 0 3px rgba(37,99,235,.12); }

  .badge{ font-size:12px; padding:4px 10px; border-radius:999px; border:1px solid transparent; white-space:nowrap; }
  .badge-gray{ background:#f3f4f6; color:#6b7280; border-color:#e5e7eb; }
  .badge-green{ background:#ecfdf5; color:#15803d; border-color:#bbf7d0; }
  .badge-red{ background:#fef2f2; color:#b91c1c; border-color:#fecaca; }
  .badge-blue{ background:#eff6ff; color:#1d4ed8; border-color:#bfdbfe; }

  .card-block{
    border:1px solid var(--border); border-radius:10px; padding:12px; margin-bottom:12px;
    background:#fff;
  }
  .card-block:last-child{ margin-bottom:0; }
  .block-title{ font-size:13px; font-weight:600; margin:0 0 10px; color:#111827; }
  .field-label{ display:block; font-size:12px; color:var(--muted); margin:8px 0 5px; }
  .row{ display:flex; gap:8px; align-items:center; }
  .hint{ font-size:11.5px; color:var(--muted); margin:8px 0 0; line-height:1.5; }

  /* ---------- 拖拽上传 ---------- */
  .dropzone{
    border:2px dashed #cfd6e0; border-radius:10px; padding:18px 12px; text-align:center;
    cursor:pointer; background:#fbfcfe; transition:.15s;
  }
  .dropzone:hover, .dropzone.drag{ border-color:var(--primary); background:#eff6ff; }
  .dz-icon{ font-size:22px; }
  .dz-text{ font-size:13px; margin-top:4px; }
  .dz-sub{ font-size:11.5px; color:var(--muted); margin-top:2px; }
  .link{ color:var(--primary); }

  .queue{ margin-top:10px; display:flex; flex-direction:column; gap:6px; max-height:220px; overflow:auto; }
  .q-item{
    display:flex; justify-content:space-between; gap:8px; font-size:12px;
    padding:6px 8px; border-radius:6px; background:#f8fafc; border:1px solid #eef1f5;
  }
  .q-item .q-name{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .q-item .q-msg{ color:var(--muted); white-space:nowrap; flex:none; }
  .q-item.done .q-msg{ color:var(--ok); }
  .q-item.fail .q-msg{ color:var(--danger); }
  .q-item.doing .q-msg{ color:var(--primary); }

  /* ---------- 中部工具栏 ---------- */
  .toolbar{
    display:flex; gap:8px; align-items:center; flex-wrap:wrap;
    padding:12px; border-bottom:1px solid #eef1f5; flex:none;
  }
  .search-wrap{ flex:1; min-width:150px; }
  .seg{ display:flex; background:#f3f4f6; border-radius:8px; padding:2px; }
  .seg-btn{
    border:none; background:transparent; padding:6px 10px; border-radius:6px;
    font-size:12px; cursor:pointer; color:var(--muted);
  }
  .seg-btn.active{ background:#fff; color:var(--text); box-shadow:0 1px 2px rgba(0,0,0,.08); font-weight:600; }
  .view-toggle{ display:flex; gap:4px; }

  .batchbar{
    display:flex; align-items:center; gap:8px; padding:8px 12px;
    background:#eff6ff; border-bottom:1px solid #dbeafe; font-size:12px;
    color:#1d4ed8; flex-wrap:wrap; flex:none;
  }
  .hidden{ display:none !important; }

  /* ---------- 画廊 ---------- */
  #gallery{ flex:1; overflow:auto; padding:12px; min-height:0; }
  #gallery.grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; align-content:start; }
  #gallery.list{ display:flex; flex-direction:column; gap:8px; }

  .state-box{
    grid-column:1/-1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:56px 12px; color:var(--muted); font-size:13px; gap:10px; text-align:center;
  }
  .state-icon{ font-size:30px; }
  .spinner{
    width:24px; height:24px; border:3px solid #e5e7eb; border-top-color:var(--primary);
    border-radius:50%; animation:spin .8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .card{
    position:relative; border:1px solid var(--border); border-radius:10px;
    background:#fff; overflow:hidden; transition:.15s;
  }
  .card:hover{ box-shadow:0 4px 12px rgba(15,23,42,.08); border-color:#cfd6e0; }
  .card.selected{ border-color:var(--primary); box-shadow:0 0 0 2px rgba(37,99,235,.18); }
  .card-check{
    position:absolute; top:6px; left:6px; z-index:2; background:rgba(255,255,255,.92);
    border-radius:5px; padding:2px; line-height:0; cursor:pointer;
  }
  .card-check input{ cursor:pointer; width:14px; height:14px; margin:0; }
  .card .thumb{
    aspect-ratio:1/1; background:#f6f8fa; display:flex; align-items:center;
    justify-content:center; overflow:hidden; cursor:zoom-in;
  }
  .card .thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .card-body{ padding:8px 10px 10px; }
  .card-name{ font-size:13px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .card-sub{ font-size:11px; color:var(--muted); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .card-actions{ display:flex; gap:6px; margin-top:8px; }
  .mini{
    flex:1; font-size:11px; padding:5px 4px; border-radius:6px; border:1px solid var(--border);
    background:#fff; color:var(--muted); cursor:pointer;
  }
  .mini:hover{ background:#f3f4f6; color:var(--text); }
  .mini.danger:hover{ background:#fef2f2; color:var(--danger); border-color:#fecaca; }

  .ph{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; color:#9aa4b2; width:100%; height:100%; }
  .ph-glyph{ font-size:20px; font-weight:600; }
  .ph-ext{ font-size:10px; text-transform:uppercase; letter-spacing:.5px; }

  .row-item{
    display:flex; align-items:center; gap:10px; padding:8px;
    border:1px solid var(--border); border-radius:10px; background:#fff;
  }
  .row-item.selected{ border-color:var(--primary); box-shadow:0 0 0 2px rgba(37,99,235,.15); }
  .row-item .thumb.small{
    width:44px; height:44px; min-width:44px; border-radius:8px; background:#f6f8fa;
    display:flex; align-items:center; justify-content:center; overflow:hidden; cursor:zoom-in;
  }
  .row-item .thumb.small img{ width:100%; height:100%; object-fit:cover; }
  .row-main{ flex:1; min-width:0; cursor:pointer; }
  .row-actions{ display:flex; gap:6px; flex:none; }
  .row-actions .mini{ flex:none; padding:5px 8px; }
  .row-item input[type=checkbox]{ width:15px; height:15px; flex:none; }

  /* ---------- 详情 ---------- */
  .detail-empty{ text-align:center; color:var(--muted); padding:44px 10px; font-size:13px; line-height:1.7; }
  .detail-preview{
    border-radius:10px; overflow:hidden; background:#f6f8fa; border:1px solid var(--border);
    margin-bottom:12px; display:flex; align-items:center; justify-content:center; min-height:110px;
  }
  .detail-preview img{ max-width:100%; max-height:220px; display:block; }
  .detail-preview.audio{ padding:14px; }
  .detail-preview.audio audio{ width:100%; }
  .detail-preview.font{ flex-direction:column; gap:6px; padding:24px; color:var(--muted); font-size:13px; }
  .detail-preview.font .ph-glyph{ font-size:34px; color:#374151; }
  .detail-row{ display:flex; gap:8px; font-size:12px; padding:5px 0; border-bottom:1px dashed #eef1f5; }
  .detail-row .k{ color:var(--muted); min-width:52px; flex:none; }
  .detail-row .v{ word-break:break-all; }
  .mono{ font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  .link-box{ display:flex; gap:6px; margin-top:4px; }
  .link-box .input{ flex:1; }
  .detail-actions{ display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }

  /* ---------- Toast ---------- */
  .toast-box{
    position:fixed; right:16px; bottom:16px; display:flex; flex-direction:column;
    gap:8px; z-index:9999; max-width:min(380px,90vw);
  }
  .toast{
    background:#1f2937; color:#fff; padding:10px 14px; border-radius:8px; font-size:13px;
    box-shadow:0 8px 24px rgba(0,0,0,.18); opacity:0; transform:translateY(8px);
    transition:.22s; word-break:break-all; line-height:1.5;
  }
  .toast.show{ opacity:1; transform:translateY(0); }
  .toast.success{ background:#15803d; }
  .toast.error{ background:#b91c1c; }

  /* ---------- 响应式 ---------- */
  @media (max-width:1024px){
    .app{ height:auto; min-height:100vh; }
    .layout{ display:block; overflow:visible; padding:12px; }
    .panel{ display:none; max-height:none; margin-bottom:12px; overflow:visible; }
    .panel.active{ display:block; }
    .panel-center{ display:none; }
    .panel-center.active{ display:flex; }
    #gallery{ max-height:62vh; }
    .tabs{ display:flex; }
  }
  @media (max-width:560px){
    .brand h1{ font-size:14px; }
    .topbar{ padding:10px 12px; }
    .topbar-right .btn{ padding:6px 9px; font-size:12px; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo">🖼️</div>
      <div>
        <h1>GitHub 图床工作台</h1>
        <p class="sub" id="repoInfo">—</p>
      </div>
    </div>
    <div class="topbar-right">
      <span id="authBadge" class="badge badge-gray">未授权</span>
      <button id="refreshBtn" class="btn btn-ghost btn-sm">刷新列表</button>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="left">配置 / 上传</button>
    <button class="tab" data-tab="center">画廊</button>
    <button class="tab" data-tab="right">详情</button>
  </nav>

  <main class="layout">
    <!-- ============ 左：配置 + 上传 ============ -->
    <aside class="panel panel-left active" id="panel-left">
      <div class="card-block">
        <h2 class="block-title">① Token 配置</h2>
        <label class="field-label" for="tokenInput">Personal Access Token</label>
        <input id="tokenInput" type="password" class="input" placeholder="ghp_xxxxxxxxxxxx"
               autocomplete="off" spellcheck="false" />
        <div class="row" style="margin-top:8px">
          <button id="verifyBtn" class="btn btn-primary" style="flex:1">验证并保存</button>
          <button id="clearTokenBtn" class="btn btn-ghost">清除</button>
        </div>
        <p class="hint" id="tokenHint">Token 仅保存在本机 localStorage，不会发送到 api.github.com 以外的任何地址。</p>
      </div>

      <div class="card-block">
        <h2 class="block-title">② 上传资产</h2>
        <div id="dropZone" class="dropzone">
          <div class="dz-icon">⬆️</div>
          <div class="dz-text">拖拽文件到这里，或 <span class="link">点击选择</span></div>
          <div class="dz-sub">支持 图片 / 音频 / 字体（单文件 ≤ 25MB）</div>
          <input type="file" id="fileInput" multiple hidden />
        </div>
        <label class="field-label" for="uploadDir">上传到目录（可选）</label>
        <input id="uploadDir" class="input" placeholder="例如 images/2024" />
        <div id="uploadQueue" class="queue"></div>
      </div>

      <div class="card-block">
        <h2 class="block-title">③ 新建子目录</h2>
        <div class="row">
          <input id="dirInput" class="input" placeholder="例如 icons" />
          <button id="createDirBtn" class="btn btn-primary">创建</button>
        </div>
        <p class="hint">将创建 <code>{目录}/.gitkeep</code> 以保留空目录。</p>
      </div>
    </aside>

    <!-- ============ 中：画廊 ============ -->
    <section class="panel panel-center" id="panel-center">
      <div class="toolbar">
        <div class="search-wrap">
          <input id="searchInput" class="input" placeholder="按文件名 / 路径搜索…" />
        </div>
        <div class="seg" id="typeFilter">
          <button class="seg-btn active" data-type="all">全部</button>
          <button class="seg-btn" data-type="image">图片</button>
          <button class="seg-btn" data-type="audio">音频</button>
          <button class="seg-btn" data-type="font">字体</button>
        </div>
        <div class="view-toggle">
          <button id="viewGrid" class="btn btn-icon active" title="网格视图">▦</button>
          <button id="viewList" class="btn btn-icon" title="列表视图">☰</button>
        </div>
      </div>

      <div id="batchBar" class="batchbar hidden">
        <span id="batchCount">已选 0 项</span>
        <button id="batchCopy" class="btn btn-sm">批量复制外链</button>
        <button id="batchDelete" class="btn btn-sm btn-danger">批量删除</button>
        <button id="batchClear" class="btn btn-sm btn-ghost">取消选择</button>
      </div>

      <div id="gallery" class="gallery grid"></div>
    </section>

    <!-- ============ 右：详情 ============ -->
    <aside class="panel panel-right" id="panel-right">
      <div id="detailBox" class="detail-empty">
        <div class="state-icon">🖼️</div>
        <p>在中间画廊选择一项查看详情</p>
      </div>
    </aside>
  </main>
</div>

<div id="toastBox" class="toast-box"></div>

<script>
/* =====================================================================
 * ============================  配 置 区  ==============================
 * ===================================================================== */
const CONFIG = {
  GITHUB_OWNER: 'lekwi6017-source',
  GITHUB_REPO: 'picture',
  GITHUB_BRANCH: 'main',
  BASE_URL: 'https://lekwi6017-source.github.io/picture/'
};
/* ===================================================================== */

const API_BASE = 'https://api.github.com';
const REPO_PATH = '/repos/' + CONFIG.GITHUB_OWNER + '/' + CONFIG.GITHUB_REPO;
const STORAGE_KEY = 'gh_pat_token';
const MAX_FILE_SIZE = 25 * 1024 * 1024;

const EXT_TYPE = {
  jpg:'image', jpeg:'image', png:'image', gif:'image', webp:'image',
  svg:'image', bmp:'image', ico:'image', avif:'image',
  mp3:'audio', wav:'audio', m4a:'audio', ogg:'audio', flac:'audio', aac:'audio',
  ttf:'font', otf:'font', woff:'font', woff2:'font', eot:'font'
};
const TYPE_LABEL = { image:'图片', audio:'音频', font:'字体' };

/* ---------------------- 安全存储（降级内存） ---------------------- */
const Store = (function () {
  let available = false;
  const mem = Object.create(null);
  try {
    const k = '__gh_probe__';
    window.localStorage.setItem(k, '1');
    window.localStorage.removeItem(k);
    available = true;
  } catch (e) {
    available = false;
  }
  return {
    available: available,
    get: function (k) {
      try { return available ? window.localStorage.getItem(k) : (k in mem ? mem[k] : null); }
      catch (e) { return (k in mem ? mem[k] : null); }
    },
    set: function (k, v) {
      try { if (available) { window.localStorage.setItem(k, v); return; } } catch (e) { /* ignore */ }
      mem[k] = v;
    },
    remove: function (k) {
      try { if (available) window.localStorage.removeItem(k); } catch (e) { /* ignore */ }
      delete mem[k];
    }
  };
})();

/* ---------------------------- 工具函数 ---------------------------- */
const $  = function (sel, root) { return (root || document).querySelector(sel); };
const $$ = function (sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); };

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}
function encodePath(p) {
  return String(p).split('/').filter(function (s) { return s.length > 0; })
    .map(encodeURIComponent).join('/');
}
function extOf(name) {
  const i = String(name).lastIndexOf('.');
  return i >= 0 ? String(name).slice(i + 1).toLowerCase() : '';
}
function fmtSize(n) {
  if (n === undefined || n === null) return '—';
  if (n < 1024) return n + ' B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
  return (n / 1024 / 1024).toFixed(2) + ' MB';
}
function rawUrl(path) {
  return 'https://raw.githubusercontent.com/' + CONFIG.GITHUB_OWNER + '/' + CONFIG.GITHUB_REPO +
    '/' + encodeURIComponent(CONFIG.GITHUB_BRANCH) + '/' + encodePath(path);
}
function extLink(path) {
  const base = CONFIG.BASE_URL.charAt(CONFIG.BASE_URL.length - 1) === '/'
    ? CONFIG.BASE_URL : CONFIG.BASE_URL + '/';
  return base + encodePath(String(path).replace(/^\/+/, ''));
}
function fileToBase64(file) {
  return new Promise(function (resolve, reject) {
    const reader = new FileReader();
    reader.onload = function () {
      const s = String(reader.result || '');
      const i = s.indexOf(',');
      resolve(i >= 0 ? s.slice(i + 1) : '');
    };
    reader.onerror = function () { reject(new Error('读取本地文件失败')); };
    reader.readAsDataURL(file);
  });
}
async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch (e) { /* 继续降级 */ }
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, ta.value.length);
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  } catch (e) { return false; }
}

/* ---------------------------- 状态 ---------------------------- */
const state = {
  token: '',
  authorized: false,
  assets: [],
  loading: false,
  filterType: 'all',
  search: '',
  view: 'grid',
  selected: new Set(),
  current: null,
  uploads: []
};

/* ---------------------------- DOM 引用 ---------------------------- */
const el = {
  repoInfo: $('#repoInfo'),
  authBadge: $('#authBadge'),
  refreshBtn: $('#refreshBtn'),
  tokenInput: $('#tokenInput'),
  verifyBtn: $('#verifyBtn'),
  clearTokenBtn: $('#clearTokenBtn'),
  tokenHint: $('#tokenHint'),
  dropZone: $('#dropZone'),
  fileInput: $('#fileInput'),
  uploadDir: $('#uploadDir'),
  uploadQueue: $('#uploadQueue'),
  dirInput: $('#dirInput'),
  createDirBtn: $('#createDirBtn'),
  searchInput: $('#searchInput'),
  typeFilter: $('#typeFilter'),
  viewGrid: $('#viewGrid'),
  viewList: $('#viewList'),
  gallery: $('#gallery'),
  batchBar: $('#batchBar'),
  batchCount: $('#batchCount'),
  batchCopy: $('#batchCopy'),
  batchDelete: $('#batchDelete'),
  batchClear: $('#batchClear'),
  detailBox: $('#detailBox'),
  toastBox: $('#toastBox'),
  tabs: $$('.tab'),
  panels: { left: $('#panel-left'), center: $('#panel-center'), right: $('#panel-right') }
};

/* ---------------------------- Toast ---------------------------- */
function toast(msg, type, duration) {
  type = type || 'info';
  duration = duration || 2800;
  const d = document.createElement('div');
  d.className = 'toast ' + type;
  d.textContent = msg;
  el.toastBox.appendChild(d);
  requestAnimationFrame(function () { d.classList.add('show'); });
  setTimeout(function () {
    d.classList.remove('show');
    setTimeout(function () { if (d.parentNode) d.parentNode.removeChild(d); }, 260);
  }, duration);
}

/* ---------------------------- API 封装 ---------------------------- */
function describeError(status, data, remaining) {
  if (status === 0) return '网络异常';
  if (status === 401) return 'Token 无效或已过期（401），请重新生成 Token';
  if (status === 403) {
    if (String(remaining) === '0') return 'GitHub API 调用次数已超限（403），请稍后再试';
    const m = data && data.message ? String(data.message) : '';
    if (/not accessible|Resource not accessible/i.test(m)) return 'Token 权限不足（403），请确保勾选 repo 权限';
    return '无权限访问或被限流（403）';
  }
  if (status === 404) return '资源不存在（404）：仓库 / 分支 / 路径可能有误，或 Token 无该仓库权限';
  if (status === 409) return '冲突（409）：文件已被修改，请刷新后重试';
  if (status === 422) return '请求无法处理（422）：路径或参数不合法';
  if (status >= 500) return 'GitHub 服务器错误（' + status + '），请稍后重试';
  return '请求失败（' + status + '）';
}

async function gh(path, options) {
  options = options || {};
  const headers = { 'Accept': 'application/vnd.github.v3+json' };
  if (state.token) headers['Authorization'] = 'token ' + state.token;
  if (options.body !== undefined) headers['Content-Type'] = 'application/json';

  let res;
  try {
    res = await fetch(API_BASE + path, {
      method: options.method || 'GET',
      headers: headers,
      body: options.body,
      cache: 'no-store'
    });
  } catch (e) {
    return { ok: false, status: 0, networkError: true, data: null,
             message: '网络异常：无法连接 GitHub API，请检查网络或代理设置' };
  }

  const remaining = res.headers.get('x-ratelimit-remaining');
  let data = null;
  let text = '';
  try { text = await res.text(); } catch (e) { text = ''; }
  if (text) {
    try { data = JSON.parse(text); } catch (e) { data = text; }
  }
  const out = { ok: res.ok, status: res.status, data: data, remaining: remaining };
  if (!res.ok) out.message = describeError(res.status, data, remaining);
  return out;
}

/* ---------------------------- 鉴权 ---------------------------- */
function setAuthBadge(kind, text) {
  const map = { ok: 'badge-green', fail: 'badge-red', checking: 'badge-blue', idle: 'badge-gray' };
  el.authBadge.className = 'badge ' + (map[kind] || 'badge-gray');
  el.authBadge.textContent = text;
}

async function doVerify(token, silent) {
  token = String(token || '').trim();
  if (!token) { toast('请先输入 Personal Access Token', 'error'); return; }

  state.token = token;
  setAuthBadge('checking', '验证中…');
  el.verifyBtn.disabled = true;

  const r = await gh(REPO_PATH);

  el.verifyBtn.disabled = false;

  if (r.ok) {
    state.authorized = true;
    Store.set(STORAGE_KEY, token);
    setAuthBadge('ok', '已授权');
    const d = r.data || {};
    el.tokenHint.textContent = '已连接 ' + (d.full_name || (CONFIG.GITHUB_OWNER + '/' + CONFIG.GITHUB_REPO)) +
      ' · ' + (d.private ? '私有仓库' : '公开仓库') +
      ' · 默认分支 ' + (d.default_branch || CONFIG.GITHUB_BRANCH);
    if (!silent) toast('验证成功，Token 已保存到本机', 'success');
    await loadAssets();
  } else {
    state.authorized = false;
    state.token = '';
    if (r.status === 401) Store.remove(STORAGE_KEY);
    setAuthBadge('fail', r.status === 401 ? 'Token 无效' : '验证失败');
    el.tokenHint.textContent = r.message;
    toast(r.message, 'error', 4200);
  }
}

function clearToken() {
  Store.remove(STORAGE_KEY);
  state.token = '';
  state.authorized = false;
  state.assets = [];
  state.selected.clear();
  state.current = null;
  state.uploads = [];
  el.tokenInput.value = '';
  el.uploadQueue.innerHTML = '';
  setAuthBadge('idle', '未授权');
  el.tokenHint.textContent = 'Token 仅保存在本机 localStorage，不会发送到 api.github.com 以外的任何地址。';
  renderGallery();
  renderDetail();
}

/* ---------------------------- 拉取资产 ---------------------------- */
async function loadAssets() {
  if (!state.token) return;
  if (state.loading) return;

  state.loading = true;
  renderGallery();

  const r = await gh('/git/trees/' + encodeURIComponent(CONFIG.GITHUB_BRANCH) + '?recursive=1');

  state.loading = false;

  if (!r.ok) {
    renderGallery();
    toast(r.message || '获取文件列表失败', 'error', 4200);
    return;
  }

  const tree = (r.data && Array.isArray(r.data.tree)) ? r.data.tree : [];
  const list = [];
  for (let i = 0; i < tree.length; i++) {
    const node = tree[i];
    if (!node || node.type !== 'blob' || !node.path) continue;
    const ext = extOf(node.path);
    const type = EXT_TYPE[ext];
    if (!type) continue;
    const parts = node.path.split('/');
    list.push({
      path: node.path,
      name: parts[parts.length - 1],
      ext: ext,
      type: type,
      size: typeof node.size === 'number' ? node.size : 0,
      sha: node.sha || ''
    });
  }
  list.sort(function (a, b) { return a.path.localeCompare(b.path); });
  state.assets = list;

  // 清理已失效的选中 / 当前项
  const alive = Object.create(null);
  list.forEach(function (a) { alive[a.path] = true; });
  Array.from(state.selected).forEach(function (p) { if (!alive[p]) state.selected.delete(p); });
  if (state.current && !alive[state.current.path]) state.current = null;
  if (state.current) {
    const again = list.filter(function (a) { return a.path === state.current.path; })[0];
    state.current = again || null;
  }

  renderGallery();
  renderDetail();
}

/* ---------------------------- 渲染画廊 ---------------------------- */
function getFiltered() {
  const q = state.search.trim().toLowerCase();
  return state.assets.filter(function (a) {
    if (state.filterType !== 'all' && a.type !== state.filterType) return false;
    if (q && a.path.toLowerCase().indexOf(q) === -1) return false;
    return true;
  });
}

function thumbHTML(a) {
  if (a.type === 'image') {
    return '<img src="' + esc(rawUrl(a.path)) + '" alt="' + esc(a.name) + '" loading="lazy" />';
  }
  if (a.type === 'audio') {
    return '<div class="ph"><span class="ph-glyph">🎵</span><span class="ph-ext">' + esc(a.ext) + '</span></div>';
  }
  return '<div class="ph"><span class="ph-glyph">Aa</span><span class="ph-ext">' + esc(a.ext) + '</span></div>';
}

function cardHTML(a) {
  const sel = state.selected.has(a.path);
  const p = esc(a.path);
  return '' +
    '<article class="card' + (sel ? ' selected' : '') + '" data-path="' + p + '">' +
      '<label class="card-check" title="选择">' +
        '<input type="checkbox" data-check="' + p + '"' + (sel ? ' checked' : '') + ' />' +
      '</label>' +
      '<div class="thumb" data-open="' + p + '">' + thumbHTML(a) + '</div>' +
      '<div class="card-body">' +
        '<div class="card-name" title="' + p + '">' + esc(a.name) + '</div>' +
        '<div class="card-sub">' + (TYPE_LABEL[a.type] || '') + ' · ' + fmtSize(a.size) + '</div>' +
        '<div class="card-actions">' +
          '<button class="mini" data-act="copy" data-path="' + p + '">复制外链</button>' +
          '<button class="mini danger" data-act="del" data-path="' + p + '">删除</button>' +
        '</div>' +
      '</div>' +
    '</article>';
}

function rowHTML(a) {
  const sel = state.selected.has(a.path);
  const p = esc(a.path);
  return '' +
    '<div class="row-item' + (sel ? ' selected' : '') + '" data-path="' + p + '">' +
      '<input type="checkbox" data-check="' + p + '"' + (sel ? ' checked' : '') + ' />' +
      '<div class="thumb small" data-open="' + p + '">' + thumbHTML(a) + '</div>' +
      '<div class="row-main" data-open="' + p + '">' +
        '<div class="card-name">' + esc(a.name) + '</div>' +
        '<div class="card-sub">' + p + ' · ' + fmtSize(a.size) + '</div>' +
      '</div>' +
      '<div class="row-actions">' +
        '<button class="mini" data-act="copy" data-path="' + p + '">复制外链</button>' +
        '<button class="mini danger" data-act="del" data-path="' + p + '">删除</button>' +
      '</div>' +
    '</div>';
}

function renderGallery() {
  const scrollTop = el.gallery.scrollTop;
  el.gallery.className = 'gallery ' + (state.view === 'grid' ? 'grid' : 'list');

  if (state.loading) {
    el.gallery.innerHTML = '<div class="state-box"><div class="spinner"></div><p>正在读取仓库文件…</p></div>';
  } else if (!state.token) {
    el.gallery.innerHTML = '<div class="state-box"><div class="state-icon">🔑</div><p>请先在左侧验证并保存 Token</p></div>';
  } else if (state.assets.length === 0) {
    el.gallery.innerHTML = '<div class="state-box"><div class="state-icon">📂</div><p>仓库里还没有图片 / 音频 / 字体资源</p></div>';
  } else {
    const list = getFiltered();
    if (list.length === 0) {
      el.gallery.innerHTML = '<div class="state-box"><div class="state-icon">🔍</div><p>没有匹配的资源</p></div>';
    } else {
      const html = list.map(function (a) {
        return state.view === 'grid' ? cardHTML(a) : rowHTML(a);
      }).join('');
      el.gallery.innerHTML = html;
    }
  }

  el.gallery.scrollTop = scrollTop;
  renderBatchBar();
}

function renderBatchBar() {
  const n = state.selected.size;
  el.batchBar.classList.toggle('hidden', n === 0);
  el.batchCount.textContent = '已选 ' + n + ' 项';
}

/* ---------------------------- 详情面板 ---------------------------- */
function openDetail(path) {
  const a = state.assets.filter(function (x) { return x.path === path; })[0] || null;
  state.current = a;
  renderDetail();
  if (window.innerWidth <= 1024) switchTab('right');
}

function renderDetail() {
  const a = state.current;
  if (!a) {
    el.detailBox.className = 'detail-empty';
    el.detailBox.innerHTML = '<div class="state-icon">🖼️</div><p>在中间画廊选择一项查看详情</p>';
    return;
  }
  el.detailBox.className = '';
  const link = extLink(a.path);
  const raw = rawUrl(a.path);

  let preview = '';
  if (a.type === 'image') {
    preview = '<div class="detail-preview"><img src="' + esc(raw) + '" alt="' + esc(a.name) + '" /></div>';
  } else if (a.type === 'audio') {
    preview = '<div class="detail-preview audio"><audio controls preload="none" src="' + esc(raw) + '"></audio></div>';
  } else {
    preview = '<div class="detail-preview font"><span class="ph-glyph">Aa</span><span>' +
      esc((a.ext || '').toUpperCase()) + ' 字体文件</span></div>';
  }

  el.detailBox.innerHTML = '' +
    preview +
    '<div class="detail-row"><span class="k">文件名</span><span class="v">' + esc(a.name) + '</span></div>' +
    '<div class="detail-row"><span class="k">路径</span><span class="v mono">' + esc(a.path) + '</span></div>' +
    '<div class="detail-row"><span class="k">类型</span><span class="v">' + (TYPE_LABEL[a.type] || '') + ' · ' + esc(a.ext) + '</span></div>' +
    '<div class="detail-row"><span class="k">大小</span><span class="v">' + fmtSize(a.size) + '</span></div>' +
    '<div class="detail-row"><span class="k">SHA</span><span class="v mono">' + esc(String(a.sha || '').slice(0, 10)) + '</span></div>' +
    '<label class="field-label">对外链接</label>' +
    '<div class="link-box">' +
      '<input class="input mono" readonly id="detailLink" value="' + esc(link) + '" />' +
      '<button class="btn btn-primary btn-sm" id="detailCopy">复制</button>' +
    '</div>' +
    '<div class="detail-actions">' +
      '<a class="btn btn-ghost btn-sm" href="' + esc(raw) + '" target="_blank" rel="noopener">查看原文件</a>' +
      '<button class="btn btn-danger btn-sm" id="detailDelete">删除此文件</button>' +
    '</div>';

  const copyBtn = $('#detailCopy');
  const delBtn = $('#detailDelete');
  if (copyBtn) copyBtn.addEventListener('click', function () { handleCopy(a.path); });
  if (delBtn) delBtn.addEventListener('click', function () { handleDelete(a.path); });
}

/* ---------------------------- 复制 ---------------------------- */
async function handleCopy(path) {
  const link = extLink(path);
  const ok = await copyText(link);
  if (ok) toast('外链已复制：' + link, 'success', 2400);
  else toast('复制失败，请手动选中链接复制', 'error', 3200);
}

/* ---------------------------- 删除 ---------------------------- */
async function deleteOne(path) {
  const g = await gh('/contents/' + encodePath(path) + '?ref=' + encodeURIComponent(CONFIG.GITHUB_BRANCH));
  if (!g.ok) return g;
  const sha = g.data && g.data.sha;
  if (!sha) return { ok: false, message: '无法获取文件 SHA，删除已中止' };
  return gh('/contents/' + encodePath(path), {
    method: 'DELETE',
    body: JSON.stringify({
      message: 'delete: ' + path,
      branch: CONFIG.GITHUB_BRANCH,
      sha: sha
    })
  });
}

async function handleDelete(path) {
  if (!state.token) { toast('请先验证并保存 Token', 'error'); return; }
  const sure = window.confirm('确定要删除吗？\n\n' + path + '\n\n该操作会直接提交到 GitHub，不可撤销。');
  if (!sure) return;

  toast('正在删除…', 'info', 1200);
  const r = await deleteOne(path);
  if (r.ok) {
    toast('已删除：' + path, 'success');
    state.selected.delete(path);
    if (state.current && state.current.path === path) state.current = null;
    renderDetail();
    await loadAssets();
  } else {
    toast(r.message || '删除失败', 'error', 4200);
  }
}

/* ---------------------------- 批量操作 ---------------------------- */
async function batchCopy() {
  const paths = Array.from(state.selected);
  if (!paths.length) return;
  const text = paths.map(function (p) { return extLink(p); }).join('\n');
  const ok = await copyText(text);
  if (ok) toast('已复制 ' + paths.length + ' 条外链', 'success');
  else toast('复制失败，请手动复制', 'error');
}

async function batchDelete() {
  const paths = Array.from(state.selected);
  if (!paths.length) return;
  const sure = window.confirm('确定删除选中的 ' + paths.length + ' 个文件吗？\n\n该操作不可撤销。');
  if (!sure) return;

  let ok = 0, fail = 0;
  for (let i = 0; i < paths.length; i++) {
    const r = await deleteOne(paths[i]);
    if (r.ok) ok++; else fail++;
  }
  toast('批量删除完成：成功 ' + ok + ' 个' + (fail ? '，失败 ' + fail + ' 个' : ''),
        fail ? 'error' : 'success', 3600);
  state.selected.clear();
  state.current = null;
  renderDetail();
  await loadAssets();
}

/* ---------------------------- 上传 ---------------------------- */
async function uploadOne(file, dir) {
  const path = (dir ? dir + '/' : '') + file.name;

  // 1) 检查是否已存在（存在则覆盖）
  let sha = null;
  const chk = await gh('/contents/' + encodePath(path) + '?ref=' + encodeURIComponent(CONFIG.GITHUB_BRANCH));
  if (chk.ok) {
    sha = chk.data && chk.data.sha;
    if (!sha) throw new Error('目标路径已存在但无法读取 SHA');
  } else if (chk.status !== 404) {
    throw new Error(chk.message || '检查文件是否存在失败');
  }

  // 2) 读取为 base64
  const content = await fileToBase64(file);

  // 3) 提交
  const body = {
    message: (sha ? 'update: ' : 'upload: ') + path,
    content: content,
    branch: CONFIG.GITHUB_BRANCH
  };
  if (sha) body.sha = sha;

  const r = await gh('/contents/' + encodePath(path), {
    method: 'PUT',
    body: JSON.stringify(body)
  });
  if (!r.ok) throw new Error(r.message || '上传失败');
  return r.data;
}

function renderQueue() {
  if (!state.uploads.length) { el.uploadQueue.innerHTML = ''; return; }
  el.uploadQueue.innerHTML = state.uploads.map(function (it) {
    return '<div class="q-item ' + it.status + '">' +
      '<span class="q-name" title="' + esc(it.name) + '">' + esc(it.name) + '</span>' +
      '<span class="q-msg">' + esc(it.msg) + '</span>' +
    '</div>';
  }).join('');
}

async function handleFiles(fileList) {
  if (!state.token) { toast('请先验证并保存 Token', 'error'); return; }
  const files = Array.prototype.slice.call(fileList || []);
  if (!files.length) return;

  const accepted = [];
  const skipped = [];
  files.forEach(function (f) {
    const ext = extOf(f.name);
    if (EXT_TYPE[ext] && f.size <= MAX_FILE_SIZE) accepted.push(f);
    else skipped.push(f.name);
  });

  if (skipped.length) {
    toast('已跳过 ' + skipped.length + ' 个文件（类型不支持或超过 25MB）：' +
          skipped.slice(0, 3).join('、') + (skipped.length > 3 ? ' 等' : ''), 'error', 4200);
  }
  if (!accepted.length) return;

  const dir = el.uploadDir.value.trim().replace(/^\/+|\/+$/g, '');
  const items = accepted.map(function (f) {
    return { name: f.name, status: 'pending', msg: '排队中' };
  });
  state.uploads = items;
  renderQueue();

  let okCount = 0, failCount = 0;

  for (let i = 0; i < accepted.length; i++) {
    const item = items[i];
    item.status = 'doing';
    item.msg = '上传中…';
    renderQueue();
    try {
      await uploadOne(accepted[i], dir);
      item.status = 'done';
      item.msg = '上传成功';
      okCount++;
    } catch (err) {
      item.status = 'fail';
      item.msg = (err && err.message) ? err.message : '上传失败';
      failCount++;
    }
    renderQueue();
  }

  toast('上传完成：成功 ' + okCount + ' 个' + (failCount ? '，失败 ' + failCount + ' 个' : ''),
        failCount ? 'error' : 'success', 3600);

  await loadAssets();
}

/* ---------------------------- 新建目录 ---------------------------- */
async function createDir() {
  if (!state.token) { toast('请先验证并保存 Token', 'error'); return; }
  const raw = el.dirInput.value.trim().replace(/^\/+|\/+$/g, '');
  if (!raw) { toast('请输入目录名', 'error'); return; }
  if (/[\\:*?"<>|]/.test(raw)) { toast('目录名包含非法字符', 'error'); return; }

  const keepPath = raw + '/.gitkeep';

  const chk = await gh('/contents/' + encodePath(keepPath) + '?ref=' + encodeURIComponent(CONFIG.GITHUB_BRANCH));
  if (chk.ok) { toast('该目录已存在：' + raw, 'error'); return; }

  const r = await gh('/contents/' + encodePath(keepPath), {
    method: 'PUT',
    body: JSON.stringify({
      message: 'chore: create directory ' + raw,
      content: btoa('\n'),
      branch: CONFIG.GITHUB_BRANCH
    })
  });

  if (r.ok) {
    toast('目录已创建：' + raw, 'success');
    el.dirInput.value = '';
    await loadAssets();
  } else {
    toast(r.message || '创建目录失败', 'error', 4200);
  }
}

/* ---------------------------- 标签页 ---------------------------- */
function switchTab(name) {
  el.tabs.forEach(function (t) { t.classList.toggle('active', t.dataset.tab === name); });
  Object.keys(el.panels).forEach(function (k) {
    if (el.panels[k]) el.panels[k].classList.toggle('active', k === name);
  });
}

/* ---------------------------- 事件绑定 ---------------------------- */
function bindEvents() {
  // Token
  el.verifyBtn.addEventListener('click', function () { doVerify(el.tokenInput.value, false); });
  el.tokenInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') doVerify(el.tokenInput.value, false);
  });
  el.clearTokenBtn.addEventListener('click', clearToken);

  // 刷新
  el.refreshBtn.addEventListener('click', function () {
    if (!state.token) { toast('请先验证并保存 Token', 'error'); return; }
    loadAssets();
  });

  // 上传
  el.dropZone.addEventListener('click', function () { el.fileInput.click(); });
  el.fileInput.addEventListener('change', function () {
    handleFiles(el.fileInput.files);
    el.fileInput.value = '';
  });
  ['dragenter', 'dragover'].forEach(function (ev) {
    el.dropZone.addEventListener(ev, function (e) {
      e.preventDefault(); e.stopPropagation();
      el.dropZone.classList.add('drag');
    });
  });
  ['dragleave', 'dragend'].forEach(function (ev) {
    el.dropZone.addEventListener(ev, function (e) {
      e.preventDefault();
      el.dropZone.classList.remove('drag');
    });
  });
  el.dropZone.addEventListener('drop', function (e) {
    e.preventDefault(); e.stopPropagation();
    el.dropZone.classList.remove('drag');
    if (e.dataTransfer && e.dataTransfer.files) handleFiles(e.dataTransfer.files);
  });
  // 防止整页被拖入
  window.addEventListener('dragover', function (e) { e.preventDefault(); });
  window.addEventListener('drop', function (e) { e.preventDefault(); });

  // 新建目录
  el.createDirBtn.addEventListener('click', createDir);
  el.dirInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') createDir();
  });

  // 搜索
  el.searchInput.addEventListener('input', function () {
    state.search = el.searchInput.value;
    renderGallery();
  });

  // 类型筛选
  el.typeFilter.addEventListener('click', function (e) {
    const btn = e.target.closest('[data-type]');
    if (!btn) return;
    state.filterType = btn.dataset.type;
    $$('[data-type]', el.typeFilter).forEach(function (x) {
      x.classList.toggle('active', x === btn);
    });
    renderGallery();
  });

  // 视图切换
  el.viewGrid.addEventListener('click', function () {
    state.view = 'grid';
    el.viewGrid.classList.add('active');
    el.viewList.classList.remove('active');
    renderGallery();
  });
  el.viewList.addEventListener('click', function () {
    state.view = 'list';
    el.viewList.classList.add('active');
    el.viewGrid.classList.remove('active');
    renderGallery();
  });

  // 批量
  el.batchCopy.addEventListener('click', batchCopy);
  el.batchDelete.addEventListener('click', batchDelete);
  el.batchClear.addEventListener('click', function () {
    state.selected.clear();
    renderGallery();
  });

  // 标签页
  el.tabs.forEach(function (t) {
    t.addEventListener('click', function () { switchTab(t.dataset.tab); });
  });

  // 画廊：勾选
  el.gallery.addEventListener('change', function (e) {
    const cb = e.target.closest('[data-check]');
    if (!cb) return;
    const path = cb.dataset.check;
    if (cb.checked) state.selected.add(path);
    else state.selected.delete(path);
    renderGallery();
  });

  // 画廊：点击
  el.gallery.addEventListener('click', function (e) {
    const actBtn = e.target.closest('[data-act]');
    if (actBtn) {
      e.preventDefault();
      e.stopPropagation();
      const p = actBtn.dataset.path;
      if (actBtn.dataset.act === 'copy') handleCopy(p);
      else if (actBtn.dataset.act === 'del') handleDelete(p);
      return;
    }
    if (e.target.closest('.card-check') || e.target.tagName === 'INPUT') return;

    const opener = e.target.closest('[data-open]');
    if (opener) { openDetail(opener.dataset.open); return; }

    const wrap = e.target.closest('[data-path]');
    if (wrap && (wrap.classList.contains('card') || wrap.classList.contains('row-item'))) {
      openDetail(wrap.dataset.path);
    }
  });
}

/* ---------------------------- 初始化 ---------------------------- */
function init() {
  el.repoInfo.textContent = CONFIG.GITHUB_OWNER + '/' + CONFIG.GITHUB_REPO + ' · ' + CONFIG.GITHUB_BRANCH;

  if (!Store.available) {
    el.tokenHint.textContent = '当前环境无法使用 localStorage（无痕模式 / 沙箱），Token 仅保存在内存中，刷新页面后需重新输入。';
  }

  bindEvents();
  renderGallery();
  renderDetail();

  const saved = Store.get(STORAGE_KEY);
  if (saved) {
    el.tokenInput.value = saved;
    doVerify(saved, true);
  } else {
    setAuthBadge('idle', '未授权');
  }

  // 窄屏默认展示左栏
  if (window.innerWidth <= 1024) switchTab('left');
}

init();
</script>
</body>
</html>
